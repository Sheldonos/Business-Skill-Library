credential_broker:
  id: CB-VAULT-<CAPABILITY>
  lifecycle: planned
  purpose: Issue short-lived credentials to an approved runtime tool without exposing secret material to the model, Bob Mode, skill, repository, prompt, or logs.
  provider: HashiCorp Vault or customer-approved equivalent
  requesting_capability_director: CD-<DOMAIN>-<OUTCOME>
  allowed_tool_adapters: []
  requested_scope: <specific tool operation and target environment>
  identity_binding: user_obo | workload_identity | approved_service_identity
  vault_policy_ref: <customer-policy-id>
  credential_visibility: lease_metadata_only
  secret_value_visibility: forbidden
  lease_ttl: <customer-configured-duration>
  renewal_policy: runtime-controlled-and-audited
  revocation_policy: on_completion_incident_policy_change_or_retirement
  evidence_fields: [broker_id, lease_id_hash, policy_id, issued_at, expires_at, capability_id, tool_adapter_id]
  failure_mode: fail_closed_and_open_exception_case
  approvals:
    credential_policy_owner: <role>
    tool_owner: <role>
    control_owner: <role>

# Never populate this template with a secret, token, password, endpoint credential, or Vault response value.
