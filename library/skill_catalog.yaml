library:
  name: IBM Business Skill Library
  version: 2.0.0
  master_mode: ibm-business-master
  foundation_skill_count: 11
  atomic_skill_count: 300
  total_skill_count: 311
  categories:
  - id: finance
    name: Finance, Treasury, Accounting, and Tax
    description: Manage finance operations, control evidence, liquidity, close, reporting, and tax readiness without making
      binding financial decisions.
    default_guardrail: Do not release funds, post financial entries, alter tax filings, or make investment decisions without
      the named human approver and a governed system action.
    integration_types: &id001
    - ERP
    - treasury management
    - bank feed
    - expense platform
    - planning and reporting
    atomic_skill_count: 25
  - id: procurement
    name: Procurement, Supplier Management, and Third-Party Risk
    description: Manage source-to-pay, supplier performance, third-party obligations, and procurement controls with accountable
      human decisions.
    default_guardrail: Do not select or suspend suppliers, accept contractual obligations, approve payments, or alter purchasing
      authority without explicit approval.
    integration_types: &id002
    - procurement suite
    - supplier portal
    - contract repository
    - risk feed
    - quality management
    atomic_skill_count: 25
  - id: revenue
    name: Sales, Account Management, Customer Success, and Revenue Operations
    description: Support revenue teams with accountable customer, deal, commitment, and adoption workflows.
    default_guardrail: Do not make pricing, contractual, customer-commitment, compensation, or account-access decisions without
      authorized human approval.
    integration_types: &id003
    - CRM
    - CPQ
    - customer success platform
    - contract repository
    - support platform
    atomic_skill_count: 25
  - id: marketing
    name: Marketing, Demand Generation, Brand, and Communications
    description: Support campaign, content, brand, audience, and communication operations with consent and claims controls.
    default_guardrail: Do not publish external content, contact audiences, make product claims, spend budget, or use personal
      data beyond approved consent and review rules.
    integration_types: &id004
    - marketing automation
    - CRM
    - content platform
    - web analytics
    - social listening
    atomic_skill_count: 25
  - id: customer-service
    name: Customer Service, Support Operations, and Contact Center Quality
    description: Improve service cases, support quality, entitlement, complaint, and contact-center operations while retaining
      human accountability.
    default_guardrail: Do not make binding refund, remedy, coverage, legal, safety, or customer-commitment decisions without
      authorized review.
    integration_types: &id005
    - case management
    - knowledge base
    - contact center
    - field service
    - CRM
    atomic_skill_count: 25
  - id: people
    name: Human Resources, Talent, Workforce Administration, and Learning
    description: Support people processes, workforce administration, learning, and planning under privacy, fairness, and accountable-human
      controls.
    default_guardrail: Do not make hiring, termination, compensation, performance, benefits, accommodation, or employment
      eligibility decisions; prepare evidence and route to accountable humans.
    integration_types: &id006
    - HCM
    - ATS
    - learning platform
    - payroll
    - workforce planning
    atomic_skill_count: 25
  - id: legal-risk
    name: Legal Operations, Privacy, Ethics, Regulatory Compliance, and Enterprise Risk
    description: Support legal, privacy, compliance, ethics, and risk evidence workflows without providing legal advice or
      making regulated determinations.
    default_guardrail: Do not provide legal conclusions, submit regulatory filings, resolve investigations, approve policy
      exceptions, or make sanctions/AML determinations without qualified human authority.
    integration_types: &id007
    - contract lifecycle management
    - GRC
    - privacy platform
    - e-discovery
    - policy repository
    atomic_skill_count: 25
  - id: operations
    name: Supply Chain, Manufacturing, Quality, Field Operations, and Asset Management
    description: Support plan-to-produce, logistics, quality, maintenance, field, and asset workflows with safety and operational
      control boundaries.
    default_guardrail: Do not change production, safety, shipping, maintenance, or quality-release decisions without qualified
      operational authority.
    integration_types: &id008
    - ERP
    - MES
    - WMS
    - quality management
    - field service
    - EAM
    atomic_skill_count: 25
  - id: it
    name: IT Service Management, Enterprise Architecture, Cloud, Application Portfolio, and FinOps
    description: Support CIO operating-model workflows across services, assets, architecture, cloud cost, and technology governance.
    default_guardrail: Do not make production changes, grant access, change configurations, commit spend, or modify recovery
      controls without authorized change and security approval.
    integration_types: &id009
    - ITSM
    - CMDB
    - cloud management
    - observability
    - asset management
    atomic_skill_count: 25
  - id: engineering
    name: Software Engineering, Platform Engineering, DevSecOps, Testing, and Release Management
    description: Support the software delivery lifecycle with evidence, quality gates, secure engineering, and human-controlled
      release decisions.
    default_guardrail: Do not deploy, merge, approve code, change production configuration, or alter security controls outside
      explicit repository, pipeline, and change-management authority.
    integration_types: &id010
    - source control
    - CI/CD
    - issue tracker
    - test platform
    - artifact registry
    atomic_skill_count: 25
  - id: cyber-resilience
    name: Cybersecurity, Incident Response, Resilience, EHS, and Physical Security
    description: Support security and resilience workflows through scoped evidence, case management, and controlled response
      preparation.
    default_guardrail: Do not block users, alter security controls, execute containment, declare incidents, or take physical
      safety actions without authorized incident or safety command.
    integration_types: &id011
    - SIEM
    - SOAR
    - identity platform
    - EDR
    - resilience platform
    atomic_skill_count: 25
  - id: data-strategy
    name: Data, Analytics, AI Governance, Product, Strategy, PMO, and Sustainability
    description: Support data, AI, portfolio, product, program, and sustainability decision workflows with evidence and accountable
      governance.
    default_guardrail: Do not grant data access, approve models, make material portfolio choices, publish sustainability claims,
      or change records without designated owner approval.
    integration_types: &id012
    - data catalog
    - lakehouse
    - BI platform
    - AI governance
    - portfolio management
    atomic_skill_count: 25
  skill_contract:
    required_fields:
    - outcome
    - intake_contract
    - procedure
    - decision_boundary
    - proactivity
    - output_contract
    - evaluation_cases
    default_action_tier: A0/A1
    default_proactivity: P0
